name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm exec tsc -p packages/ui/tsconfig.json --noEmit
          pnpm exec tsc -p apps/docs/tsconfig.json --noEmit

      - name: Unit tests
        run: pnpm --filter @vert-ui/ui exec vitest run

      - name: Contrast audit
        run: pnpm exec tsx scripts/check-contrast.ts

      - name: Registry build
        run: pnpm exec tsx packages/registry/src/build.ts

      - name: Docs build
        run: pnpm --filter @vert-ui/docs build
